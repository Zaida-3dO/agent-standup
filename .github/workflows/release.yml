name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0). Leave blank to auto-increment the minor version from the latest tag."
        required: false
        default: ""
      publish_docker:
        description: "Build and push the Docker image to ghcr.io"
        type: boolean
        default: true

# Deliberately no `concurrency` block here.
#
# `cancel-in-progress` is out regardless — this workflow pushes an image and
# publishes an npm package, and cancelling mid-publish risks a half-published
# release (partial image layers pushed, or an npm publish interrupted after
# the registry accepted it but before the job reports success).
#
# A non-cancelling *queue* was considered instead, but GitHub's concurrency
# groups don't queue arbitrarily deep: only one run is ever "in progress" per
# group, and if a second run is already pending when a third arrives, the
# second is silently CANCELLED to make room for the third — cancellation
# happens to a queue slot even with cancel-in-progress: false, it just
# happens before that run starts instead of mid-publish. For a release
# pipeline that would mean an intermediate tag (e.g. v1.2.1, pushed shortly
# after v1.2.0 and shortly before v1.2.2) never gets released at all, with no
# louder signal than a "cancelled" run in the Actions history — worse than
# leaving concurrency alone, where every tagged push publishes.
#
# Tag pushes are also not the problem this change exists for: they are rare,
# deliberate, one-at-a-time events, not the "pushed a PR branch three times
# in five minutes" pattern that makes CI's mutation-testing job worth
# cancelling. There is no evidence of wasted runs here to fix.
#
# What this does NOT cover: two releases publishing concurrently can still
# race on which one's `latest` Docker tag write lands last, independent of
# trigger order (docker/metadata-action's `type=raw,value=latest` is
# unconditional — see the comment below). That's a pre-existing ordering risk
# this change neither introduces nor fixes, and no concurrency shape
# available here (cancel, or GitHub's shallow queue) fixes it without the
# silent-drop downside above — it would need an explicit release-sequencing
# mechanism, which is out of scope for a concurrency block.

jobs:
  # The single source of the version this run releases, for both trigger paths.
  #
  # A `push: tags` run already has its tag — this job just echoes
  # `github.ref_name` so downstream jobs have one input to read either way.
  #
  # A `workflow_dispatch` run has no tag until this job makes one. It takes the
  # `version` input if given, otherwise bumps the minor of the latest v-tag
  # (v0.5.0 -> v0.6.0), then pushes it. Pushing the tag is what lets the rest of
  # the workflow behave identically to a tagged push: `docker/metadata-action`'s
  # `type=semver` reads a real tag, and the Release object below names one that
  # exists in the repository rather than a ref that only lived inside a run.
  #
  # A manual dispatch used to build an image and stop there — `github-release`
  # and `publish-npm` were gated on `github.ref_type == 'tag'`, so a dispatch
  # silently skipped both and produced no release at all. That gate is now
  # unnecessary: every path through this workflow has a tag by the time those
  # jobs run.
  #
  # Pushing a tag from here does NOT start a second run of this workflow, even
  # though `push: tags` above matches it: GitHub does not trigger workflows from
  # events made with the automatic `GITHUB_TOKEN`, specifically to stop
  # recursion. That is load-bearing — this run goes on to release the tag
  # itself, so a triggered second run would be a duplicate release racing this
  # one. If the push is ever switched to a PAT or an App token, that suppression
  # is lost and this workflow needs a guard against releasing the same tag twice.
  tag:
    name: Determine the version tag
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The auto-increment reads existing tags, which a shallow clone omits.
          fetch-depth: 0
      - name: Resolve the tag for this run
        id: tag
        # Inputs arrive through the environment rather than being interpolated
        # into the script — the same rule the jobs below already follow for
        # `github.*` values, and the reason actionlint accepts this form.
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Triggered by a tag push — releasing $REF_NAME."
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A dispatch can be started from any branch, and everything below
          # tags whatever that branch points at. Releasing unmerged code is
          # never the intent: it would publish a Release, move the `latest`
          # image that docker-compose.prod.yml pulls by default, and update the
          # version badge that reads the Releases API — all from code that is
          # not on the default branch. A tag push is exempt because the tag
          # itself is the deliberate choice of what to release.
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from $DEFAULT_BRANCH only, but this run was dispatched from '$REF_NAME'. Merge first, then dispatch from $DEFAULT_BRANCH."
            exit 1
          fi

          if [ -n "$VERSION_INPUT" ]; then
            next="$VERSION_INPUT"
            # Validated by the same script the npm publish uses, rather than by
            # a second pattern written here. A regex duplicated in two places
            # drifts: an earlier revision of this job accepted `v01.2.3`, which
            # scripts/version-from-tag.mjs rejects as non-semver, so a typo
            # could pass this gate and fail only at the publish step — after the
            # tag, the image and the Release already existed. Worse, a version
            # that loose also makes `type=semver` emit no version tag at all,
            # which is precisely what this validation is here to prevent.
            #
            # The script imports only `node:url`, so it runs on the runner's
            # node without an `npm ci` first.
            if ! node scripts/version-from-tag.mjs "$next" >/dev/null 2>&1; then
              echo "::error::Version '$next' is not a valid release tag. Use v<major>.<minor>.<patch>, e.g. v1.2.0 (no leading zeros), optionally with a prerelease suffix such as v1.2.0-rc.1."
              exit 1
            fi
          else
            # Prereleases are excluded on purpose, and the grep is what does it
            # — the glob alone does not. `v[0-9]*.[0-9]*.[0-9]*` is fnmatch, not
            # a regex, so each `*` also matches `-rc.1`; and with
            # versionsort.suffix unset, `--sort=-version:refname` ranks
            # `v1.0.0-rc.1` ABOVE `v1.0.0`. Together those would make a blank
            # dispatch bump from a release candidate — turning v1.0.0-rc.1 into
            # v1.1.0 and silently skipping v1.0.0 altogether.
            # `|| true` is load-bearing: with no matching tag `grep` exits 1,
            # and under `set -o pipefail` that becomes the pipeline's status.
            # `errexit` applies to a bare assignment like this one, so without
            # the fallback the very first release — the one case with no tags
            # to match — would abort the job instead of starting at v0.1.0.
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n1 || true)"
            if [ -z "$latest" ]; then
              next="v0.1.0"
              echo "No version given and no existing release tag — starting at $next."
            else
              major="$(printf '%s' "$latest" | cut -d. -f1 | tr -d 'v')"
              minor="$(printf '%s' "$latest" | cut -d. -f2)"
              next="v${major}.$((minor + 1)).0"
              echo "No version given — auto-incrementing the minor version from $latest to $next."
            fi
          fi

          # Refuse rather than move an existing tag: the image, the Release and
          # (once enabled) the npm package for that version already exist, and
          # repointing the tag would leave them describing different commits.
          #
          # The message names the retry path deliberately. This tag is pushed
          # before the image builds, so a failed build leaves the tag behind
          # with nothing published against it — and the obvious next move,
          # dispatching the same version again, lands here. "Re-run failed jobs"
          # is the one route that actually retries that version: it keeps this
          # job's existing output instead of re-running it, so the build retries
          # against the tag that is already there. Dispatching a *different*
          # version works too but burns a number and leaves a permanent hole in
          # the sequence.
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists. To retry a release whose build failed, use 'Re-run failed jobs' on the original run rather than dispatching again — that reuses this tag. Dispatch a new version only if you intend to skip $next."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # On a tag push this always runs; `inputs.publish_docker` is empty for a
  # non-dispatch event, so the `!= 'false'` form is what keeps that path
  # unconditional (an `== 'true'` test would skip the image on every tag push).
  # On a dispatch the checkbox defaults to true and unticking it releases
  # without touching ghcr.io — useful when the image for a commit already
  # exists and only the Release is missing.
  build-and-push:
    needs: tag
    if: inputs.publish_docker != 'false'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag a dispatch just created is newer than the ref this workflow
          # started from, so check it out explicitly — otherwise a dispatch
          # builds whatever the branch tip happens to be when this job starts,
          # which is a different commit from the tag if anything lands mid-run.
          ref: ${{ needs.tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `type=semver` parses the *triggering* ref, which on a manual
          # dispatch is the branch, not the tag this run created — so the tag
          # is handed over explicitly. On a tag push this is the same value the
          # action would have inferred anyway.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=sha
            # Unconditional on purpose. This workflow only runs on a v* tag or a
            # manual dispatch, so every run is a release and should move `latest`.
            # Gating it on {{is_default_branch}} risks a tagged release never
            # updating `latest` — which docker-compose.prod.yml pulls by default,
            # so the deploy would silently keep serving the previous image.
            type=raw,value=latest
      # The version this run is releasing, without its leading `v` — the
      # same reading of the same tag that `docker/metadata-action`'s
      # `type=semver,pattern={{version}}` takes above, and that the npm job
      # below takes for what it publishes. Derived by the one script that
      # owns that parse rather than by a `${TAG#v}` written here: a second
      # place that strips the prefix is a second place that can disagree
      # about a prerelease tag, and the script refuses anything it cannot
      # parse instead of guessing.
      - name: Derive the version to bake into the image
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "APP_VERSION=$(node scripts/version-from-tag.mjs "$RELEASE_TAG")" >> "$GITHUB_ENV"
          # ISO-8601 UTC, matching the format of the OCI `created` label.
          echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # The sha of the tree this job actually checked out — NOT
          # `github.sha`, which is the commit the workflow was *triggered*
          # from. On a manual dispatch those differ: the `tag` job creates
          # the tag after the run starts, and the checkout above pins
          # `ref: needs.tag.outputs.tag` precisely because the branch tip
          # can move mid-run. Baking `github.sha` would report a commit the
          # image was not built from, which is a more dangerous lie than
          # the missing version this row exists to fix.
          echo "APP_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What makes the running process able to answer "what is deployed".
          #
          # These carry the same two facts into the *process* that
          # `steps.meta.outputs.labels` above carries into the image's OCI
          # metadata — deliberately from the same values, so the label and
          # the running build can never disagree. The label alone was the
          # only honest answer before this, and reading it required a shell
          # on the deploy host plus the right `docker inspect --format`.
          #
          # `APP_REVISION` is resolved by `git rev-parse HEAD` in the step
          # above rather than from `github.sha` — see that step's comment
          # for why the two differ on a manual dispatch.
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag is not a release. The README's version badges read the Releases API,
  # and `docker compose pull` users have nowhere to read what changed between
  # two image tags — both want a Release object, which nothing here was
  # creating, so tags accumulated and the Releases page stayed empty.
  #
  # `needs: build-and-push` is the same reasoning as the npm job below: a
  # Release announces an image that can be pulled, so it must not exist until
  # the image for this tag actually does. It also needs the `tag` job, both for
  # its output and because `build-and-push` already depends on it.
  # `always()` is required only because `build-and-push` is now skippable — a
  # skipped dependency would otherwise skip this job too, silently producing no
  # Release, which is the exact failure this workflow was changed to fix. The
  # explicit result test keeps the original guarantee: a Release still never
  # appears for an image build that FAILED, only for one that was deliberately
  # not run.
  github-release:
    name: Publish the GitHub Release
    needs: [tag, build-and-push]
    if: always() && needs.tag.result == 'success' && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
        with:
          # `--generate-notes` diffs against the previous tag, which is not in
          # the default shallow clone. Without the full history the notes come
          # out empty.
          fetch-depth: 0
      - name: Create the Release for this tag
        # The tag arrives through the environment rather than being
        # interpolated into the script, matching the npm job below — the form
        # actionlint accepts for a github.* value inside `run:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        # Idempotent on purpose: re-running this workflow for a tag that was
        # already released should be a no-op, not a red run.
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes

  # MILESTONES.md #89: the npm package ships the `standup` binary on the
  # same version tag that publishes the image above, so the two artefacts of
  # a release can never drift apart. `needs: build-and-push` is deliberate —
  # this only runs once the image for this tag has actually been built and
  # pushed, so a failed image build can never leave a published npm package
  # naming a version whose image doesn't exist.
  #
  # The `tag` job's output is the one tag this whole workflow runs from. There
  # is nothing else to keep in sync: `scripts/version-from-tag.mjs` turns it
  # into the npm version to publish, mirroring the same `v<semver>` reading
  # `docker/metadata-action`'s `type=semver,pattern={{version}}` (above)
  # already takes of it — both artefacts are versioned from one parse of one
  # tag. `package.json`'s own checked-in "version" is not used for what gets
  # published; see the script's header for why that is the safer default.
  #
  # ⚠️ DORMANT — gated off until npm publishing is configured.
  #
  # This job is gated on `vars.ENABLE_NPM_PUBLISH == 'true'` rather than
  # deleted. Publishing needs an `NPM_TOKEN` secret; without one,
  # `NODE_AUTH_TOKEN` is an empty string and `npm publish` fails with
  # ENEEDAUTH after doing all of its work. Everything else in the job — the
  # tag-to-version derivation, the prepack build, the tarball — runs
  # correctly, so the job is worth keeping intact behind a flag.
  #
  # A skipped job stays visible in the checks UI, so it is apparent that the
  # publish did not happen. A deleted job cannot say that.
  #
  # To turn it on (see the "Publish the standup binary to npm" issue):
  #   1. Create an npm *Automation* token for the package — that token type
  #      bypasses 2FA, which CI cannot satisfy interactively.
  #   2. `gh secret set NPM_TOKEN --repo Zaida-3dO/agent-standup`
  #   3. `gh variable set ENABLE_NPM_PUBLISH --body true --repo Zaida-3dO/agent-standup`
  # Check who owns the `agent-standup` name on the registry before enabling:
  # the first successful publish of an unclaimed name claims it permanently.
  publish-npm:
    name: Publish npm package (standup binary)
    needs: [tag, build-and-push]
    # Same shape as github-release above, for the same reason: tolerate a
    # deliberately skipped image build, never a failed one.
    if: always() && vars.ENABLE_NPM_PUBLISH == 'true' && needs.tag.result == 'success' && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
        with:
          # Same reason as build-and-push: publish the tag's source, not the
          # branch tip the dispatch happened to start from.
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Derive the npm version from this release tag
        # The tag comes in through an env var, not interpolated straight
        # into the script below — the safe way to use a github.* value
        # inside `run:` (the direct-interpolation form is a template
        # injection risk actionlint flags for exactly this reason).
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION="$(node scripts/version-from-tag.mjs "$RELEASE_TAG")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set the package version to match the tag (CI-local only, never committed)
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build the standup binary and publish
        # `npm publish` runs the "prepack" script first (npm run build:cli),
        # so the package always ships whatever this exact tag's source
        # produces — never a stale dist/ left over from a previous build.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
