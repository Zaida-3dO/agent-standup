name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets mutation testing be run on demand while it is off by default. It is
  # the only job gated on this event, so dispatching the workflow runs the
  # ordinary checks plus the one that is otherwise skipped — which is what
  # makes "off until pre-GA" a default rather than a deletion. See the
  # `mutation-testing` job below and `docs/plans/BEFORE-GA.md`.
  workflow_dispatch:
  # Required so the required checks below (`Build & test`, `Actionlint
  # (required)`, `Docker build (required)`) can actually report a result
  # against a merge-queue `merge_group` ref. Without this trigger, enabling
  # GitHub's merge queue would make it wait forever for statuses that never
  # get posted — the queue hangs and nothing can merge. See
  # docs/merge-queue-runbook.md for the full picture.
  merge_group:
    types: [checks_requested]

# Cancels a superseded run of the SAME pull request — the expensive step here
# is mutation-testing (22-57 min), so a PR pushed several times in quick
# succession used to burn a full mutation run per push even though only the
# last one's result would ever matter.
#
# Scoped so ONLY pull_request runs can ever share a group and be cancelled:
#   - pull_request events group by PR number (`pr-<number>`): pushing again to
#     the same PR shares a group with, and cancels, that PR's own prior run.
#   - every other event (merge_group, push to main) groups by `github.run_id`,
#     which is unique per run, so it can never collide with anything else in
#     the group — never queued behind another run, never cancelled by one.
#     This is deliberately stronger than grouping by ref: GitHub's own
#     concurrency semantics cancel not only what cancel-in-progress targets,
#     but ALSO silently cancel any already-pending run sharing the group when
#     a newer one joins it. A merge_group run sharing a group with anything
#     would risk recreating the exact "queue waits forever for a status that
#     never posts" failure this workflow's merge_group trigger exists to
#     prevent (docs/merge-queue-runbook.md); a `main` push sharing a group
#     with another `main` push would risk one merge's verification being
#     silently skipped. Per-run-id groups make both impossible, not just
#     unlikely.
#   - cancel-in-progress is separately gated on event_name == 'pull_request'
#     too, as a second, independent guard — even if the group key above were
#     ever loosened, a non-PR run still could not be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v6
      # v4 (not v3) is required here: v3 has no merge_group handling at all,
      # so on a merge_group event it would fall back to comparing the
      # temporary gh-readonly-queue/* ref against the default branch using
      # an undocumented merge-base search — v4.0.1 added first-class
      # merge_group support (base/ref default to the event's own
      # merge_group.base_sha/head_sha), which is what makes the `changes`
      # outputs below reliable instead of merely "probably works". See
      # docs/merge-queue-runbook.md.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              # A `package.json` lifecycle script (`prepare`, `postinstall`, ...)
              # or a dependency bump can break `npm ci` inside the image even
              # though it never touches Dockerfile itself — see
              # `tests/ci-docker-paths-filter.test.ts` for the regression this
              # covers and why it needs its own assertion, not just this
              # comment, to stay true.
              - 'package.json'
              - 'package-lock.json'
            source:
              - 'src/**/*.ts'
              - 'src/**/*.tsx'

  actionlint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  # Every `*-gate` job below decides its verdict from `needs.changes.outputs.*`,
  # which is a string produced by another job. That string is only `'true'` or
  # `'false'` when the `changes` job actually ran to completion: if it errors
  # outright — an internal fault, a network failure during its own checkout —
  # the output is the **empty string** instead, because a job that did not
  # finish published no outputs.
  #
  # An empty scope must fail, not pass. A gate whose steps all test equality
  # against `'true'` or `'false'` runs no step at all on an empty value and
  # then reports success by default, having verified nothing. That is strictly
  # worse than having no gate: the required check is green and the thing it
  # exists to enforce was never evaluated, which is invisible precisely when
  # it matters.
  #
  # So each gate carries an explicit third branch that fails on any value
  # other than the two it knows how to interpret. This is the same posture
  # `scripts/check-db-import-allowlist.mjs` already takes when it finds zero
  # files to inspect — a check that is not running against anything is worse
  # than one that is not running at all — generalised to the jobs that had
  # been left out of it.
  actionlint-gate:
    name: Actionlint (required)
    needs: [changes, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # ┌─ THE FAIL-CLOSED GATE PATTERN — copied by every `… (required)` job ─┐
      #
      # All three required gates carry these same three steps, differing only
      # in the `changes` output they read. It is deliberately duplicated rather
      # than factored into a composite action: a composite cannot read the
      # `needs` context, so every output would have to be threaded through
      # `with:` — more indirection than the three lines it would save.
      #
      # If you add a fourth gate, copy all three steps, and keep this shape:
      #
      #   1. Fail  — output is neither 'true' nor 'false'  -> MUST `exit 1`
      #   2. Pass  — output == 'false'                     -> echo only
      #   3. Fail  — output == 'true' && dep != 'success'  -> MUST `exit 1`
      #
      # Step 1 is the one that matters and the one that has been got wrong: a
      # job that errors publishes no outputs, an absent output reads as the
      # empty string, and a gate whose branches only cover 'true'/'false'
      # matches nothing, runs no step, and reports SUCCESS having checked
      # nothing (#73). A step that only echoes exits 0 — so the `exit 1` is
      # the whole point of the branch, not decoration.
      #
      # Enforced by `tests/ci-gate-scope-fail-closed.test.ts`, which discovers
      # every `(required)` job from this file: a fourth gate added without
      # these steps fails that suite rather than going unnoticed.
      #
      # └────────────────────────────────────────────────────────────────────┘
      - name: Fail — the changes job did not report a usable scope
        if: needs.changes.outputs.workflows != 'true' && needs.changes.outputs.workflows != 'false'
        run: |
          echo "::error::The 'changes' job did not produce a usable 'workflows' output."
          echo "Got: '${{ needs.changes.outputs.workflows }}' (expected 'true' or 'false')."
          echo "That means this gate cannot tell whether actionlint needed to run, so it"
          echo "fails rather than passing on an unverified scope. Check the 'changes' job."
          exit 1
      - name: Pass — workflows not changed
        if: needs.changes.outputs.workflows == 'false'
        run: echo "No workflow files changed, skipping actionlint"
      - name: Fail — actionlint failed
        if: needs.changes.outputs.workflows == 'true' && needs.actionlint.result != 'success'
        run: exit 1

  # The verification work is split across two jobs that run at the same time,
  # and `build-and-test` below is the gate that joins them back into the
  # single required status check. The split line is `TEST_DATABASE_URL`, not
  # a list of file names: every database-backed test file self-gates on that
  # variable (`const describeIfDb = testDatabaseUrl ? describe : describe.skip`),
  # so the identical `npm test` command runs in both jobs and the environment
  # alone decides which suites execute. A database test added later lands on
  # the right side by itself, with no workflow edit and nothing to keep in
  # sync.
  static-checks:
    name: Static checks & build
    runs-on: ubuntu-latest
    env:
      # `prisma generate` and `next build` need this to resolve, not to
      # connect — the app issues no queries at build time, and this job runs
      # no Postgres service. `TEST_DATABASE_URL` is deliberately absent, which
      # is what makes the database suites skip here and run in `db-tests`.
      DATABASE_URL: postgresql://standup:standup@localhost:5432/standup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # Before `npm ci`, because it needs nothing but the checkout (Node
      # builtins only) and it is the one failure here that is permanent once
      # merged: this repository is public, so anything describing a system
      # outside it is world-readable from the moment it lands. Cheap to catch
      # here, impossible to unpublish.
      - name: Check nothing refers to anything outside this repository
        run: npm run check:external-refs
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Check the database-client import allowlist
        run: npm run check:db-imports
      # Reads the schema text and the source tree only — no client, no
      # database, which is why it belongs in this job beside the other
      # structural check it resembles rather than with the database tests.
      - name: Check every declared event type has an emitter
        run: npm run check:event-emitters
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # Reports which suites this job's environment will skip, so the count
      # is in the log beside the green tick rather than nowhere. Deliberately
      # the reporting mode: this job has no Postgres by design, so failing on
      # a skip here would fail the split the two jobs exist to make.
      - name: Report which suites are database-gated
        run: npm run check:db-gated
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      # A real, disposable Postgres — starts empty on every run, which is
      # what makes it double as the "clean database" migrate-deploy proves
      # against below. Version matches docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: standup
          POSTGRES_PASSWORD: standup
          POSTGRES_DB: standup
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U standup"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Used for real by the migrate-deploy and drift steps below, against
      # the `postgres` service above.
      DATABASE_URL: postgresql://standup:standup@localhost:5432/standup
      # A separate variable, not DATABASE_URL: vitest.config.ts pins
      # DATABASE_URL to a fake value for tests that don't need a real
      # connection. TEST_DATABASE_URL points the DB-integration tests (real
      # unreachable-address, real migration-failure, real pool-pressure
      # paths — see tests/boot.test.ts) at the same disposable service used
      # above, so they run for real on every PR instead of skipping.
      TEST_DATABASE_URL: postgresql://standup:standup@localhost:5432/standup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
      - name: Create shadow database for the drift check
        run: npx prisma db execute --url "postgresql://standup:standup@localhost:5432/postgres" --stdin <<< "CREATE DATABASE standup_shadow;"
      - name: Check schema.prisma and migrations match (no drift)
        run: npm run db:check-drift
        env:
          SHADOW_DATABASE_URL: postgresql://standup:standup@localhost:5432/standup_shadow
      # The assertion half. This is the job whose whole purpose is running the
      # database suites, so it must fail rather than pass if its environment
      # stopped handing one over — otherwise every gated file skips, `npm test`
      # goes green having checked none of them, and the result is
      # indistinguishable from a healthy run.
      - name: Assert the database suites will actually run
        run: npm run check:db-gated:require
      - name: Test
        run: npm test

  # The one required status check that main's branch protection names, and
  # the single dependency every downstream job declares. Its name is load
  # bearing: branch protection matches a check by name, so this string has to
  # stay exactly `Build & test` for protected merges to resolve at all.
  #
  # Judged on `result == 'success'` for both halves rather than on
  # `success()`, because a half that is cancelled or skipped is not a half
  # that passed — and with `if: always()` this job runs in precisely those
  # cases. Anything other than a genuine pass on both sides fails here.
  build-and-test:
    name: Build & test
    needs: [static-checks, db-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail — a verification job did not pass
        if: needs.static-checks.result != 'success' || needs.db-tests.result != 'success'
        run: exit 1

  mutation-testing:
    name: Mutation testing (changed files)
    needs: [changes, build-and-test]
    # What this job answers, and nothing else in the pipeline does: would a
    # test actually fail if the behaviour it names regressed? A test that
    # asserts nothing passes the ordinary suite, reads as coverage in a diff,
    # and has survived both a green run and a human review here. Mutation
    # testing is the only check that can tell the two apart, because it is
    # the only one that changes the source and demands the suite notice.
    #
    # **Scoped to the source files a pull request actually changed**, not the
    # whole tree. Mutation testing costs roughly the full test suite per
    # mutant, so a whole-tree run scales with the repository rather than with
    # the diff and would grow without bound; a changed-files scope keeps the
    # cost proportional to what is being reviewed, which is also where a
    # hollow test is most likely to have just been written. `changes.source`
    # is what makes it skip entirely on a docs-only pull request.
    #
    # **Gated on `build-and-test` already being green.** Mutation testing
    # against a build that does not pass its own tests spends the slowest job
    # in the pipeline restating what the fastest one already said — every
    # mutant "survives" a suite that was failing anyway, so the result is
    # noise rather than a weaker signal.
    #
    # **It is the slowest job here by a wide margin — 22-57 minutes** against
    # single-digit minutes for everything else, and pipeline latency is what
    # decides how fast work merges. That cost is the reason for both scopes
    # above; it is worth paying because the thing it catches is invisible to
    # every cheaper check, and a hollow test is worse than a missing one — it
    # is a missing test with a green tick beside it.
    #
    # ── Why this is OFF until pre-GA (owner's call, 2026-08-18) ────────────
    #
    # **It does not run, on any branch, including `main`.** Two reasons, and
    # the second is the one that decided it:
    #
    # **It is a 22-57 minute tax on every iteration.** On a pull request that
    # lands squarely on merge latency, which is what decides how fast work
    # moves through the queue. On `main` it is cheaper only in the sense that
    # nobody is waiting on it — and that is also why it gates nothing there:
    # the merge has already happened, so a survivor is a notification rather
    # than a refusal.
    #
    # **Its first real run against a service operation produced findings no
    # test could act on.** `sweep.ts` scored 33-38 with four survivors, all in
    # the `defineOperation({…})` metadata — a module-level literal evaluated
    # once at import, before Stryker activates any mutant at runtime. No test
    # written any way can kill those, which is a property of every operation
    # module, not of `sweep.ts`. Paying the slowest job in the pipeline to
    # re-report a tool limitation on each new operation is not a trade worth
    # making while the product is still being built. See issue #166.
    #
    # **This is deliberately not the `false &&` pause it replaces.** That
    # switched the job off while leaving it configured to look like it ran.
    # This states the decision, names what would change it, and keeps the job
    # runnable — `workflow_dispatch` still triggers it on demand.
    #
    # Turning it back on is a **pre-GA gate**, tracked in
    # `docs/plans/BEFORE-GA.md` rather than as a milestone row: the milestone
    # queue answers what to build next, and this is something to close before
    # shipping, which is a different question.
    if: >-
      github.event_name == 'workflow_dispatch'
      && needs.changes.outputs.source == 'true'
      && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: standup
          POSTGRES_PASSWORD: standup
          POSTGRES_DB: standup
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U standup"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://standup:standup@localhost:5432/standup
      TEST_DATABASE_URL: postgresql://standup:standup@localhost:5432/standup
    steps:
      - uses: actions/checkout@v6
        with:
          # The incremental/changed-files scope diffs against origin/main,
          # which needs real history, not the single-commit shallow clone
          # actions/checkout defaults to.
          #
          # This also covers the merge_group case: `fetch-depth: 0` fetches
          # full history for ALL branches regardless of triggering event
          # (per actions/checkout's own docs), so `origin/main` is still a
          # valid, current ref when this job runs against a merge-queue
          # temporary ref. `scripts/run-mutation-tests.mjs` diffs with
          # `origin/main...HEAD` (three-dot / merge-base form), which stays
          # correct even if `origin/main` has moved past the merge group's
          # own base_sha by the time this job runs (concurrent queue
          # activity) — the merge-base is still the group's true base, not
          # main's newest tip, so the diff only ever reflects files the
          # queued batch actually touches. Verified by inspection of
          # actions/checkout + git diff semantics, not by running a live
          # merge queue — see docs/merge-queue-runbook.md.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
      # Restores Stryker's incremental result cache (a prior run's verdict
      # per mutant, reused when neither the mutated source nor its killing
      # test changed) so a run only re-tests what could plausibly have
      # changed. `restore-keys` deliberately falls back to the newest cache
      # from ANY branch, not just this one — a fork's first run, or a PR
      # branched before the cache existed, still benefits instead of always
      # paying the full-run cost once per branch. That fallback is safe to
      # do blindly: a mutant reused from an unrelated branch's cache is only
      # ever accepted if Stryker's own diff finds the exact source text at
      # its location AND (for a prior kill) the killing test's own source
      # unchanged — anything else is re-tested for real. The wrapper itself
      # also validates this file's content before Stryker ever reads it and
      # deletes it outright if it is not well-formed — see
      # `validateIncrementalCache` in `scripts/lib/mutation-report-guards.mjs`.
      - name: Restore mutation testing incremental cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mutation-incremental-${{ runner.os }}-
      - name: Mutation test changed source files
        run: npm run test:mutate:changed
      # Saved even when the mutation-testing step above fails the score
      # threshold — the cache holds per-mutant test RESULTS, which are true
      # regardless of whether the overall run passed the break threshold,
      # and the next run still benefits from not re-testing unchanged code.
      - name: Save mutation testing incremental cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ runner.os }}-${{ github.run_id }}

  mutation-testing-gate:
    name: Mutation testing (required)
    needs: [changes, mutation-testing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail — the changes job did not report a usable scope
        if: needs.changes.outputs.source != 'true' && needs.changes.outputs.source != 'false'
        run: |
          echo "::error::The 'changes' job did not produce a usable 'source' output."
          echo "Got: '${{ needs.changes.outputs.source }}' (expected 'true' or 'false')."
          echo "That means this gate cannot tell whether mutation testing needed to run, so"
          echo "it fails rather than passing on an unverified scope. Check the 'changes' job."
          exit 1
      - name: Pass — no source files changed
        if: needs.changes.outputs.source == 'false'
        run: echo "No src/**/*.ts(x) files changed, skipping mutation testing"
      # `skipped` and `failure` are different facts and this gate has to tell
      # them apart, because only one of them is a statement about the code.
      #
      # A `skipped` result on a source change means the mutation job's own
      # `if:` did not hold — and with `changes.source == 'true'` already
      # established here, the only remaining way for that to happen is
      # `build-and-test` not having succeeded. That case is already red on
      # `Build & test`, which is itself required, so failing here as well
      # would add a second red check reporting the same fact while telling
      # whoever reads it to look in the wrong place. It is passed here on the
      # strength of that other gate, not forgiven.
      #
      # A `failure` result still fails, unconditionally. That is the case
      # where mutation testing ran and found surviving mutants, and it must
      # never be softened — the whole value of the job is that it fails on
      # something no cheaper check can see.
      #
      # The branch is also what keeps the two jobs independently editable: any
      # future narrowing of the mutation job's `if:` shows up here as a pass
      # with a stated reason rather than as a required check nothing in the
      # pull request can clear.
      - name: Pass — mutation testing did not run, and the suite it follows is already red
        if: needs.changes.outputs.source == 'true' && needs.mutation-testing.result == 'skipped'
        run: echo "Mutation testing did not run. It follows 'Build & test', which is required and reports that failure itself."
      - name: Fail — mutation testing ran and did not pass
        if: >-
          needs.changes.outputs.source == 'true' &&
          needs.mutation-testing.result != 'success' &&
          needs.mutation-testing.result != 'skipped'
        run: exit 1

  docker-build:
    name: Docker build (dry run)
    needs: [changes, build-and-test]
    if: needs.changes.outputs.docker == 'true' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-gate:
    name: Docker build (required)
    needs: [changes, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail — the changes job did not report a usable scope
        if: needs.changes.outputs.docker != 'true' && needs.changes.outputs.docker != 'false'
        run: |
          echo "::error::The 'changes' job did not produce a usable 'docker' output."
          echo "Got: '${{ needs.changes.outputs.docker }}' (expected 'true' or 'false')."
          echo "That means this gate cannot tell whether the Docker build needed to run, so"
          echo "it fails rather than passing on an unverified scope. Check the 'changes' job."
          exit 1
      - name: Pass — Docker files not changed
        if: needs.changes.outputs.docker == 'false'
        run: echo "No Docker-relevant files changed, skipping docker-build"
      - name: Fail — docker-build failed
        if: needs.changes.outputs.docker == 'true' && needs.docker-build.result != 'success'
        run: exit 1
