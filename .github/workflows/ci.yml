name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

  actionlint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  actionlint-gate:
    name: Actionlint (required)
    needs: [changes, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — workflows not changed
        if: needs.changes.outputs.workflows == 'false'
        run: echo "No workflow files changed, skipping actionlint"
      - name: Fail — actionlint failed
        if: needs.changes.outputs.workflows == 'true' && needs.actionlint.result != 'success'
        run: exit 1

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      # Not a real database. `prisma generate` and `next build` only need
      # the datasource env var to resolve, not an actual connection — the
      # app never queries at build time.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (dry run)
    needs: [changes, build-and-test]
    if: needs.changes.outputs.docker == 'true' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-gate:
    name: Docker build (required)
    needs: [changes, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — Docker files not changed
        if: needs.changes.outputs.docker == 'false'
        run: echo "No Docker-relevant files changed, skipping docker-build"
      - name: Fail — docker-build failed
        if: needs.changes.outputs.docker == 'true' && needs.docker-build.result != 'success'
        run: exit 1
