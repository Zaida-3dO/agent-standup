# Production deploy. The image is PULLED from GHCR, never built here — no
# `build:` block, no local Dockerfile context, no bind mounts. This file is
# deliberately generic — the app expecting a reachable Postgres via
# DATABASE_URL — so it works wherever it's dropped. On a host that groups
# several apps under one shared compose file, fold these service blocks (and a
# Postgres block alongside them) into that file instead of running this one
# standalone; the shape is the same either way, only the file it lives in
# changes. See README.md's Deployment section for the details that matter
# either way (host port, DB readiness ordering, health check).
#
# `pull` needs registry auth if the package is private — keep a scoped
# credential in this directory's own .docker/config.json (never committed):
#   DOCKER_CONFIG=./.docker docker compose --env-file .env.production \
#     -f docker-compose.prod.yml pull
# `up` needs no DOCKER_CONFIG once the image is local.
#
# If Postgres runs as its own container in the same compose project, give it
# `depends_on: condition: service_healthy` on the app service — the
# entrypoint runs `prisma migrate deploy` at boot, which opens a real DB
# connection even when there are zero pending migrations, so the app must not
# start before Postgres is actually accepting connections. A cold first boot
# of Postgres (initdb + its own internal restart) can take noticeably longer
# than a short healthcheck window — give its healthcheck a generous
# `start_period` (observed: ~100s on slow disk) or `depends_on` can give up
# before Postgres finishes, even though it comes up fine moments later.
services:
  app:
    container_name: agent-standup
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env.production, e.g. ghcr.io/OWNER/agent-standup:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      # Per-machine bearer tokens, `machine:token` comma-separated. Required:
      # with it unset the server refuses every authenticated call, which is
      # the intended posture rather than an inconvenience — a gate that
      # switched itself off when unconfigured would be open exactly when a
      # deployment had gone wrong. It is bootstrap by the same test as the
      # line above (known before the process reaches the database), and it
      # could not be a stored setting in any case: settings are served to the
      # front end and printed by the command line, with no redaction path.
      # One entry must belong to the front end's own machine (named `browser`
      # by default). The browser is never handed a credential — anything a
      # page holds is readable from the developer tools, which would defeat
      # per-machine revocation — so it calls a server-side route that
      # attaches this token and forwards to the same authenticated handlers.
      # Without it the front end serves a 503 rather than calling the API
      # with no credential at all.
      STANDUP_TOKENS: ${STANDUP_TOKENS:?Set STANDUP_TOKENS in .env.production, e.g. browser:TOKEN,laptop:TOKEN}
      # Everything the application reads once it is running is a database
      # setting, configured via /settings or `standup config set` — not an
      # environment variable. What's left here is only what must be known
      # before the process can reach the database (see SCHEMA.md §17).
      # How long scripts/entrypoint.mjs waits for Postgres to accept a query
      # before giving up, and how often it retries. Given an explicit default
      # here (rather than left to fall through to entrypoint.mjs's own) so
      # the knob is discoverable without reading the code — given a numeric
      # default rather than `${VAR:-}` because entrypoint.mjs treats an
      # explicitly-set-but-invalid value (including "") as a boot-time
      # configuration error, not a silent fallback, so an unset var must
      # resolve to a real number here, never to "".
      DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-180}
      DB_WAIT_INTERVAL_SECONDS: ${DB_WAIT_INTERVAL_SECONDS:-2}
      TZ: ${TZ:-UTC}
    healthcheck:
      # Readiness, not liveness — and the distinction decides what this
      # check is worth. A compose health state is what `depends_on:
      # service_healthy` and any orchestrator's traffic decision read, and
      # both of those want *can it serve a query*. `/api/health` deliberately
      # avoids the database, so it answers 200 from a process whose Postgres
      # is still initialising: a healthcheck pointed at it goes green while
      # every real call still fails. `/api/ready` runs the cheapest real
      # query and reports the migration state with it, so a container that
      # is connected but two migrations behind is not reported as ready.
      #
      # The probe is unauthenticated by design, which is why this needs no
      # token: the things that ask it run before an installation is
      # configured. It answers only booleans and counts.
      #
      # Uses Node's built-in fetch rather than curl/wget — the runner image
      # (node:24-alpine) doesn't ship either, but Node always does.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # scripts/entrypoint.mjs waits up to DB_WAIT_TIMEOUT_SECONDS (default
      # 180s, above) for Postgres before it even attempts to migrate, so the
      # app doesn't start listening until that wait resolves. 180s comfortably
      # exceeds this same file's own recorded cold-boot observation just
      # above (~100s on slow disk). start_period covers that wait plus
      # `prisma migrate deploy` and server startup on top. If you raise
      # DB_WAIT_TIMEOUT_SECONDS above, raise start_period to match — it is
      # not derived from that variable, so nothing else will do it for you,
      # and a database that's still within its now-larger allowed wait will
      # otherwise report as unhealthy while it's actually still booting
      # correctly.
      start_period: 240s
